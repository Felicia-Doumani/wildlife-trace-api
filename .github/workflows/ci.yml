name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wildtrace_test
          POSTGRES_PASSWORD: wildtrace_test
          POSTGRES_DB: wildtrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wildtrace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://wildtrace_test:wildtrace_test@localhost:5432/wildtrace_test
      DATABASE_URL: postgresql+psycopg://wildtrace_test:wildtrace_test@localhost:5432/wildtrace_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run Ruff
        run: ruff check .

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Build Docker image
        run: docker build -t wildlife-trace-api:test .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wildlife-trace-api:test
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
  

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wildlife-trace-api" >> "$GITHUB_ENV"

      - name: Tag Docker image
        run: docker tag wildlife-trace-api:test "$IMAGE_NAME:latest"

        
      - name: Push Docker image
        run: docker push "$IMAGE_NAME:latest"