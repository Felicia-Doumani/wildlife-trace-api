services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://wildtrace:wildtrace@db:5432/wildtrace
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wildtrace
      POSTGRES_PASSWORD: wildtrace
      POSTGRES_DB: wildtrace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildtrace"]
      interval: 5s

  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wildtrace_test
      POSTGRES_PASSWORD: wildtrace_test
      POSTGRES_DB: wildtrace_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildtrace_test"]
      interval: 5s

  redis:
    image: redis:7-alpine

  worker:
    build: .
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://wildtrace:wildtrace@db:5432/wildtrace
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app

volumes:
  pgdata: